spring:
  datasource:
    url: jdbc:h2:mem:matchlog;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: true
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.matchlog.be: DEBUG
